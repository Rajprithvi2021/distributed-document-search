name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1. Fast feedback: lint + unit/integration tests on in-memory adapters and fakeredis.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Test (coverage gate)
        run: pytest --cov=app --cov-report=term --cov-fail-under=90
      - name: Validate deployment manifests
        run: python -c "import yaml,glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('deploy/**/*.y*ml', recursive=True) + ['docker-compose.yml']]"

  # 2. The Elasticsearch and Redis adapters against the real engines (same versions as compose).
  live:
    runs-on: ubuntu-latest
    needs: test
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-timeout 10s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ES_TEST_URL: http://localhost:9200
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Live adapter + full-stack tests
        run: pytest tests/live -v -rs

  # 3. End to end: the exact docker compose stack a reviewer runs (gateway, 2 API replicas, worker, ES, Redis).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (sync indexing)
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test through the gateway
        run: bash scripts/smoke_test.sh http://localhost:8000
      - name: Restart with async indexing (202 + Redis Streams + worker)
        run: |
          INDEXING_MODE=async docker compose up -d --wait --wait-timeout 300
          docker compose restart gateway   # API containers were recreated with new IPs
          sleep 3
          bash scripts/smoke_test.sh http://localhost:8000
      - name: Health report
        run: curl -s http://localhost:8000/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
