[project]
name = "distributed-document-search"
version = "2.0.0"
description = "Multi-tenant distributed document search service (FastAPI + Elasticsearch + Redis)"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
  "B008",   # FastAPI's Depends()/Query() in defaults is idiomatic
  "RUF012", # mutable class attrs are fine on pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]
