# Blue-green deployment demo.
#
#   cd deploy/blue-green
#   BLUE_TAG=docsearch-api:1.0 GREEN_TAG=docsearch-api:2.0 docker compose -f docker-compose.bluegreen.yml up -d
#   ./switch.sh green     # health-gated cut-over (instant, reversible)
#   ./switch.sh blue      # rollback
#
# Both colours share Elasticsearch/Redis (stateless API, backward-compatible index mappings),
# so switching moves traffic without touching data.
name: docsearch-bluegreen

x-app-env: &app-env
  SEARCH_BACKEND: elasticsearch
  STATE_BACKEND: redis
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_USERNAME: elastic
  ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-change-me-elastic}
  ELASTICSEARCH_REFRESH: wait_for
  REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
  RUN_EMBEDDED_WORKER: "false"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-change-me-elastic}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy volatile-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-blue:
    image: ${BLUE_TAG:-docsearch-api:local}
    environment:
      <<: *app-env
      APP_VERSION: ${BLUE_VERSION:-blue}
    depends_on:
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }

  api-green:
    image: ${GREEN_TAG:-docsearch-api:local}
    environment:
      <<: *app-env
      APP_VERSION: ${GREEN_VERSION:-green}
    depends_on:
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./upstreams:/etc/nginx/upstreams
    ports:
      - "8000:8080"
    depends_on:
      - api-blue
      - api-green
