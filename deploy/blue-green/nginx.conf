worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  client_max_body_size 10m;

  # active.conf defines `upstream active_api { ... }`; switch.sh rewrites it and reloads
  # nginx. In-flight requests finish on the old colour (graceful reload).
  include /etc/nginx/upstreams/active.conf;

  server {
    listen 8080;

    location / {
      proxy_pass http://active_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
