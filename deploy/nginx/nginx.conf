# Edge gateway: load-balances across all `api` replicas (Docker DNS), applies a per-IP
# rate limit (the API's per-tenant limit is the second layer), caps body size,
# propagates/creates X-Request-ID, and keeps operational endpoints off the public edge.
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  keepalive_timeout 65s;
  client_max_body_size 10m;

  # Per-client-IP protection against floods and credential stuffing (unauthenticated traffic).
  # Load tests from a single machine exceed this by design: raise `rate`/`burst` for benchmarking.
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=200r/s;
  limit_req_status 429;

  # Keep a caller-supplied request id, otherwise generate one.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # Re-resolve the service name so scaled/restarted replicas are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    set $api_upstream http://api:8000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    # Retry idempotent requests on another replica only when that replica is down/restarting.
    # (Not on 503: the API returns 503 when a shared dependency is down, and every replica would agree.)
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 2;

    # Operational endpoints (dependency details, metrics, API docs) are for the platform and operators:
    # reachable from private networks (load balancer, Prometheus, local Docker host), not the internet.
    location ~ ^/(health|metrics|docs|redoc|openapi\.json) {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass $api_upstream;
    }

    location / {
      limit_req zone=per_ip burst=400 nodelay;
      proxy_pass $api_upstream;
    }
  }
}
