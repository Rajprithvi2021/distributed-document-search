# Edge gateway: load-balances across all `api` replicas (Docker DNS), applies a per-IP
# rate limit (the API's per-tenant limit is the second layer), caps body size, and
# propagates/creates X-Request-ID for end-to-end correlation.
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  keepalive_timeout 65s;
  client_max_body_size 10m;

  # Per-client-IP protection against floods and credential stuffing (unauthenticated traffic).
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=200r/s;
  limit_req_status 429;

  # Keep a caller-supplied request id, otherwise generate one.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # Re-resolve the service name so scaled/restarted replicas are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    location / {
      limit_req zone=per_ip burst=400 nodelay;

      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $req_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      # Idempotent requests are retried on another replica if one is down or restarting.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
